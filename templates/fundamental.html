<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>基本面数据 · 展示与溯源</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/fundamental.css') }}?v=20260813">
</head>
<body>
<div class="hdr">
  <h1>📊 基本面数据 · 展示与溯源</h1>
  <span class="sub">TQ-Local → DuckDB → API → 页面</span>
  <div class="sb">
    <input id="q" type="text" placeholder="搜索股票名称 / 代码 / 拼音..." autocomplete="off">
    <div id="sug" class="sug" style="display:none"></div>
  </div>
  <span class="st" id="conn">连通性检测中...</span>
  <button class="btn-sync-hdr" onclick="openSync()">＋ 添加股票 / 同步数据</button>
  <a class="home" href="/">🏠 主站</a>
  <a class="home" href="/screener">🎯 选股</a>
</div>
<div class="layout">
  <div class="side">
    <h3>已同步股票 <span class="side-count" id="syncedCount"></span></h3>
    <div class="stock-list" id="stockList"><div class="empty" style="padding:20px">加载中...</div></div>
    <div id="stockPager" class="stock-pager" style="display:none"></div>
    <h3>自动同步</h3>
    <div class="auto-sync-panel" id="autoSyncPanel">
      <div class="as-row">
        <label class="as-toggle">
          <input type="checkbox" id="asEnabled">
          <span class="as-switch"></span>
          <b>启用自动同步</b>
        </label>
      </div>
      <div class="as-biz-list" id="asBizList">
        <label class="as-biz-item"><input type="checkbox" data-biz="stock_basic"><span>基础信息</span></label>
        <label class="as-biz-item"><input type="checkbox" data-biz="financial"><span>专业财务</span></label>
        <label class="as-biz-item"><input type="checkbox" data-biz="gpjy"><span>交易专业</span></label>
        <label class="as-biz-item"><input type="checkbox" data-biz="chip"><span>筹码指标</span></label>
        <label class="as-biz-item"><input type="checkbox" data-biz="l2"><span>L2扩展</span></label>
        <label class="as-biz-item"><input type="checkbox" data-biz="shareholder"><span>股东明细</span></label>
        <label class="as-biz-item"><input type="checkbox" data-biz="mainbusi"><span>主营构成</span></label>
      </div>
      <div class="as-row as-sub">
        <label class="as-toggle">
          <input type="checkbox" id="asOnStartup">
          <span class="as-switch"></span>
          <span>启动时自动执行</span>
        </label>
        <label class="as-delay">延迟 <input type="number" id="asDelay" min="0" max="60" value="3"> 秒</label>
      </div>
      <div class="as-actions">
        <button class="btn-as-save" id="asSaveBtn">保存设置</button>
        <button class="btn-as-run" id="asRunBtn">立即执行</button>
      </div>
      <div class="as-last" id="asLastInfo"></div>
    </div>
    <h3>数据流（溯源）</h3>
    <div class="flow-wrap" id="flowMini" style="flex-direction:column;align-items:stretch;gap:6px;padding:8px 16px"></div>
  </div>
  <div class="main">
    <div class="kpi" id="kpi"></div>
    <div class="tabs">
      <button class="tab on" data-tab="overview">📋 总览画像</button>
      <button class="tab" data-tab="financial">📈 财务宽表</button>
      <button class="tab" data-tab="long">🔍 财务长表</button>
      <button class="tab" data-tab="gpjy">📊 交易专业数据</button>
      <button class="tab" data-tab="shareholder">🏛 股东明细</button>
      <button class="tab" data-tab="mainbusi">🏭 主营构成</button>
      <button class="tab" data-tab="fields">🗂 字段元数据</button>
      <button class="tab" data-tab="trace">🔗 数据溯源</button>
    </div>
    <div id="tab-overview" class="tab-pane"></div>
    <div id="tab-financial" class="tab-pane" style="display:none"></div>
    <div id="tab-long" class="tab-pane" style="display:none"></div>
    <div id="tab-gpjy" class="tab-pane" style="display:none"></div>
    <div id="tab-shareholder" class="tab-pane" style="display:none"></div>
    <div id="tab-mainbusi" class="tab-pane" style="display:none"></div>
    <div id="tab-fields" class="tab-pane" style="display:none"></div>
    <div id="tab-trace" class="tab-pane" style="display:none"></div>
  </div>
</div>
<!-- Sync Modal -->
<div id="syncModal" class="modal" style="display:none">
  <div class="modal-mask" onclick="closeSync()"></div>
  <div class="modal-body">
    <div class="modal-hdr">
      <span>📦 添加股票 / 同步基本面数据</span>
      <span class="modal-close" onclick="closeSync()">✕</span>
    </div>
    <div class="modal-content">
      <div class="sync-section">
        <label class="sync-label">① 股票代码（支持多个，逗号/空格/换行分隔，自动格式化 600519.SH）</label>
        <textarea id="syncCodes" class="sync-textarea" placeholder="例如：600519.SH, 000001.SZ&#10;或: 600519 000001（无后缀会自动补全）"></textarea>
        <div id="syncCodesPreview" class="sync-preview"></div>
      </div>

      <div class="sync-section">
        <label class="sync-label">② 同步类型（可多选，按顺序依次执行）</label>
        <div class="biz-grid">
          <label class="biz-item">
            <input type="checkbox" value="basic" checked>
            <div class="biz-card">
              <div class="biz-top"><b>基础信息</b><span class="biz-slow">秒级</span></div>
              <div class="biz-desc">公司简介 + 市场估值快照（get_stock_info + get_more_info）</div>
              <div class="biz-param" data-biz="basic" style="display:none"></div>
            </div>
          </label>
          <label class="biz-item">
            <input type="checkbox" value="financial">
            <div class="biz-card">
              <div class="biz-top"><b>专业财务</b><span class="biz-slow">较慢</span></div>
              <div class="biz-desc">FN1-584 全历史长表（每票数十秒）</div>
              <div class="biz-param" data-biz="financial" style="display:none"></div>
            </div>
          </label>
          <label class="biz-item">
            <input type="checkbox" value="gpjy">
            <div class="biz-card">
              <div class="biz-top"><b>交易专业</b><span class="biz-slow">中等</span></div>
              <div class="biz-desc">GP 长表：融资融券/龙虎榜/陆股通/涨停等</div>
              <div class="biz-param" data-biz="gpjy" style="display:none"></div>
            </div>
          </label>
          <label class="biz-item">
            <input type="checkbox" value="chip">
            <div class="biz-card">
              <div class="biz-top"><b>筹码指标</b><span class="biz-slow">中等</span></div>
              <div class="biz-desc">MCST/CYS/ASR/SCR/CYC 筹码分布指标</div>
              <div class="biz-param" data-biz="chip">回看 <input type="number" class="param-num" value="250" min="60" max="500"> 天</div>
            </div>
          </label>
          <label class="biz-item">
            <input type="checkbox" value="l2">
            <div class="biz-card">
              <div class="biz-top"><b>L2 扩展</b><span class="biz-slow">秒级</span></div>
              <div class="biz-desc">分档成交/主力净额/封单额等 L2 扩展日线</div>
              <div class="biz-param" data-biz="l2">近期 <input type="number" class="param-num" value="60" min="10" max="500"> 条</div>
            </div>
          </label>
          <label class="biz-item">
            <input type="checkbox" value="shareholder">
            <div class="biz-card">
              <div class="biz-top"><b>股东明细</b><span class="biz-slow">秒级</span></div>
              <div class="biz-desc">十大股东 / 十大流通股东（download_file）</div>
              <div class="biz-param" data-biz="shareholder">回看 <input type="number" class="param-num" value="3" min="1" max="10"> 年</div>
            </div>
          </label>
          <label class="biz-item">
            <input type="checkbox" value="mainbusi">
            <div class="biz-card">
              <div class="biz-top"><b>主营构成</b><span class="biz-slow">秒级</span></div>
              <div class="biz-desc">按产品/按行业/按地区 主营收入构成（download_file）</div>
              <div class="biz-param" data-biz="mainbusi">回看 <input type="number" class="param-num" value="3" min="1" max="10"> 年</div>
            </div>
          </label>
        </div>
      </div>

      <div class="sync-section sync-options">
        <label><input type="checkbox" id="syncForce"> 强制覆盖已同步数据</label>
      </div>

      <div id="syncProgress" class="sync-progress" style="display:none">
        <div class="prog-header"><span id="progTitle">同步中...</span><span id="progClose" class="prog-close" style="display:none;cursor:pointer">✕</span></div>
        <div class="prog-bar"><div id="progFill" class="prog-fill"></div></div>
        <div id="progLog" class="prog-log"></div>
      </div>

      <div class="sync-actions">
        <button class="btn-cancel" onclick="closeSync()">取消</button>
        <button class="btn-primary" id="btnSyncRun" onclick="runSync()">▶ 开始同步</button>
      </div>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/fundamental.js') }}?v=20260814b"></script>
</body>
</html>
